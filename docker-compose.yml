services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legalmcp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legalmcp}
      POSTGRES_USER: ${POSTGRES_USER:-legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_dev_password}
    ports:
      # External 5433 avoids conflict with a local postgres instance.
      # All inter-container connections use the internal port 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legalmcp-network

  api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legalmcp-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-legal}:${POSTGRES_PASSWORD:-legal_dev_password}@postgres:5432/${POSTGRES_DB:-legalmcp}
      VERTEX_AI_PROJECT: ${VERTEX_AI_PROJECT:-}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-europe-west3}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      OBJECT_STORE_TYPE: ${OBJECT_STORE_TYPE:-memory}
      API_PORT: ${API_PORT:-8000}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legalmcp-network

  crawler-service:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: legalmcp-crawler
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-legal}:${POSTGRES_PASSWORD:-legal_dev_password}@postgres:5432/${POSTGRES_DB:-legalmcp}
      VERTEX_AI_PROJECT: ${VERTEX_AI_PROJECT:-}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-europe-west3}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OBJECT_STORE_TYPE: ${OBJECT_STORE_TYPE:-memory}
      GCS_BUCKET: ${GCS_BUCKET:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_CONTAINER: ${AZURE_CONTAINER:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      api-service:
        condition: service_started
    networks:
      - legalmcp-network

  seed-sources:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: legalmcp-seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-legal}:${POSTGRES_PASSWORD:-legal_dev_password}@postgres:5432/${POSTGRES_DB:-legalmcp}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legalmcp-network
    # Overrides the default CMD to run the seed-sources binary instead.
    # restart: no ensures it runs once and exits (idempotent by design).
    command: ["/app/seed-sources"]
    restart: "no"

  frontend:
    build:
      context: packages/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api-service:8000}
    container_name: legalmcp-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api-service:8000}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://api-service:8000/mcp}
    ports:
      - "3000:3000"
    depends_on:
      - api-service
    networks:
      - legalmcp-network

volumes:
  postgres-data:

networks:
  legalmcp-network:
    driver: bridge
