name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-crawler:
    name: Test Crawler Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/crawler
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install ruff
          ruff check src/
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/crawler/coverage.xml
          flags: crawler

  test-mcp-server:
    name: Test MCP Server
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: packages/mcp-server
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install ruff
          ruff check src/
      
      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        run: |
          pytest tests/ -v --cov=src --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/mcp-server/coverage.xml
          flags: mcp-server

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: packages/frontend/pnpm-lock.yaml
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Lint
        run: pnpm lint
      
      - name: Type check
        run: pnpm type-check
      
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-crawler, test-mcp-server, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Crawler
        uses: docker/build-push-action@v5
        with:
          context: ./packages/crawler
          push: false
          tags: legalmcp-crawler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build MCP Server
        uses: docker/build-push-action@v5
        with:
          context: ./packages/mcp-server
          push: false
          tags: legalmcp-mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./packages/frontend
          push: false
          tags: legalmcp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
