name: Daily Crawler Job

on:
  schedule:
    # Täglich um 02:00 UTC (03:00 MEZ / 04:00 MESZ)
    - cron: '0 2 * * *'
  
  # Manueller Trigger
  workflow_dispatch:

jobs:
  run-crawler:
    name: Run Legal Crawler
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: packages/crawler
        run: pip install -r requirements.txt
      
      - name: Run Crawler
        working-directory: packages/crawler
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          CRAWLER_RATE_LIMIT: 1.0
          LOG_LEVEL: INFO
        run: python -m src.main
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: crawler-logs
          path: packages/crawler/*.log
          retention-days: 7
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Daily Crawler Job Failed',
              body: `The daily crawler job failed on ${new Date().toISOString()}\n\nWorkflow Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['crawler', 'automated']
            })
